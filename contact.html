<!DOCTYPE html>
<html lang="en">
 <head>
 <meta charset="UTF-8" />
 <meta http-equiv="X-UA-Compatible" content="IE=edge" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>Contact Us</title>
 <link rel="stylesheet" href="styles.css">
 </head>
 <body>
    <header></header>
    <h1>Contact Us!</h1>
    <main>
        <form action="formResults.html">
            <h2>Contact Information</h2>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="phone" id="phone" name="phone" placeholder="Enter your phone number">
            <br><br>

            <h2>Other Information</h2>
            <label>Are you using radio buttons?</label>
            <input type="radio" id="yes" name="button" value="male">
            <label for="yes">Yes</label>
    
            <input type="radio" id="no" name="button" value="female">
            <label for="no">No</label>
            <br><br>

            <label>Class Year</label>
            <select name="" id="">
                <option value="classYear">Select</option>
                <option value="freshman">Freshman</option>
                <option value="sophomore">Sophomore</option>
                <option value="junior">Junior</option>
                <option value="senior">Senior</option>
            </select>
            <br><br>

            <label for="major">Major Enjoyment</label>
            <input type="range" min="1" max="5">
            <p>1- Dissastified, 3- Neutral, 5- Extremely Satisfied</p>
            <label for="text">Additional Comments?</label>
            <input type="textarea">
            <br><br>

            <input type="submit" value="Submit">
            <br><br>
        </form>
    </main>
    <footer>&copy;Val R 2026</footer>
 </body>
</html>
